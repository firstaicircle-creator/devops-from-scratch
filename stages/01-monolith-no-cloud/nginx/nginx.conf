# Sample nginx.conf for the monolith lab (https://monolith.test)
# Status: written from the Nginx docs, NOT yet run. Verify with: nginx -t
# Paths differ by OS: Debian /etc/nginx/, RHEL /etc/nginx/, Homebrew (Apple Silicon) /opt/homebrew/etc/nginx/

user  nginx;                      # OS user for worker processes (www-data on Debian; remove the line on Homebrew)
worker_processes  auto;           # one worker per CPU core
error_log  /var/log/nginx/error.log  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;     # max simultaneous connections per worker
}

http {
    include       mime.types;     # maps file extensions to Content-Type
    default_type  application/octet-stream;

    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time upstream=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;       # fast static file sending
    keepalive_timeout   65;       # keep client connections open for reuse
    server_tokens       off;      # hide the Nginx version
    client_max_body_size 10m;     # larger uploads get 413

    gzip        on;               # compress responses
    gzip_types  text/css application/json application/javascript;

    # The app servers. Add more "server" lines to load balance.
    upstream monolith_app {
        server 127.0.0.1:8000;
        keepalive 16;             # reuse connections to the app
    }

    # Catch-all: unknown Host headers and direct IP access end up here
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;  # refuse TLS for unknown names (Nginx 1.19.4+)
        return 444;               # close the connection without a reply
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name monolith.test;
        return 301 https://$host$request_uri;
    }

    # The real site
    server {
        listen 443 ssl;
        http2 on;                 # Nginx 1.25.1+. Older versions: listen 443 ssl http2;
        server_name monolith.test;

        ssl_certificate      /etc/nginx/certs/monolith.crt;
        ssl_certificate_key  /etc/nginx/certs/monolith.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        add_header X-Content-Type-Options nosniff always;

        # 1. Exact match: health check for load balancers and monitoring
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 2. Static files served directly by Nginx (regex locations are skipped)
        location ^~ /static/ {
            alias /var/www/monolith/static/;
            expires 7d;
            access_log off;
        }

        # 3. Everything else goes to the app (reverse proxy)
        location / {
            proxy_pass http://monolith_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";                           # needed for upstream keepalive
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
